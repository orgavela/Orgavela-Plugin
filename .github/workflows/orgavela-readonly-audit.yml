name: OrgaVela - strictly read-only SSH health audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only SFTP, SSH, UOP schema, or O03 backup metadata preflight"
        required: true
        type: choice
        default: sftp
        options: [sftp, probe, schema, backup-preflight, cron]
  push:
    branches: [main]
    paths:
      - '.github/audit-requests/orgavela-readonly.json'
  pull_request:
    paths:
      - '.github/workflows/orgavela-readonly-audit.yml'
      - 'scripts/ci/orgavela-readonly-audit.sh'

permissions:
  contents: read

concurrency:
  group: orgavela-readonly-audit
  cancel-in-progress: false

jobs:
  # Untrusted pull requests never receive protected IONOS SSH credentials.
  static-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate read-only audit syntax and guardrails, without remote access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "orgavela/Orgavela-Plugin" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "orgavela.com" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_DISPATCH_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_MIGRATION_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          if grep -Eq '^[[:space:]]*(wp[[:space:]]+(cron[[:space:]]+event[[:space:]]+run|action-scheduler[[:space:]]+run)|crontab[[:space:]]+-)' scripts/ci/orgavela-readonly-audit.sh; then
            echo "::error::Readonly SSH audit contains a scheduler execution or crontab mutation."
            exit 1
          fi
  readonly-audit:
    if: github.repository == 'orgavela/Orgavela-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: orgavela-ionos
    env:
      IONOS_AUDIT_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_AUDIT_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
      IONOS_AUDIT_WP_ROOT: ${{ vars.IONOS_WP_ROOT || '/public' }}
    steps:
      - name: Checkout only trusted main workflow and read-only script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-in SSH script syntax
        shell: bash
        run: bash -n scripts/ci/orgavela-readonly-audit.sh
      - name: Resolve explicit read-only audit request
        env:
          MANUAL_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request='.github/audit-requests/orgavela-readonly.json'
            [[ -f "$request" ]] || exit 1
            operation="$(jq -er '.operation // empty' "$request")"
            target="$(jq -er '.target // empty' "$request")"
            [[ "$target" == 'orgavela.com' ]] || {
              echo "::error::Audit request target must be orgavela.com."; exit 1;
            }
          else
            operation="$MANUAL_OPERATION"
          fi
          [[ "$operation" == 'sftp' || "$operation" == 'probe' || "$operation" == 'schema' || "$operation" == 'backup-preflight' || "$operation" == 'cron' ]] || {
            echo "::error::Only sftp/probe/schema/backup-preflight/cron read-only operations are permitted."; exit 1;
          }
          printf 'AUDIT_OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
      - name: Install SSH transport (runner only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Run scoped read-only audit with secret-safe output
        shell: bash
        run: bash scripts/ci/orgavela-readonly-audit.sh "$AUDIT_OPERATION"
