name: OrgaVela - strictly read-only SSH health audit

on:
  # Daily observation only; this is not an IONOS cron replacement.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only SFTP/SSH/schema/backup/cron inventory (scheduled cron observation never dispatches queue)"
        required: true
        type: choice
        default: sftp
        options: [sftp, probe, schema, backup-preflight, cron]
      strict_monitor:
        description: "Fail the read-only cron audit on fresh failures or stale/unknown queue status"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/audit-requests/orgavela-readonly.json'
  pull_request:
    paths:
      - '.github/workflows/orgavela-readonly-audit.yml'
      - 'scripts/ci/orgavela-readonly-audit.sh'
      - 'scripts/ci/orgavela-cron-status-evaluate.sh'
      - '.circleci/config.yml'

permissions:
  contents: read

concurrency:
  group: orgavela-readonly-audit
  cancel-in-progress: false

jobs:
  # Untrusted pull requests never receive protected IONOS SSH credentials.
  static-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate read-only audit syntax and guardrails, without remote access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/orgavela-readonly-audit.sh
          ruby -e 'require "yaml"; YAML.safe_load(File.read(".circleci/config.yml"), aliases: true)'
          grep -Fq "orgavela/Orgavela-Plugin" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "orgavela.com" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_DISPATCH_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_MIGRATION_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          if grep -Eq '^[[:space:]]*(wp[[:space:]]+(cron[[:space:]]+event[[:space:]]+run|action-scheduler[[:space:]]+run)|crontab[[:space:]]+-)' scripts/ci/orgavela-readonly-audit.sh; then
            echo "::error::Readonly SSH audit contains a scheduler execution or crontab mutation."
            exit 1
          fi
      - name: O08 scheduler status evaluation - offline negative tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/orgavela-cron-status-evaluate.sh
          command -v shellcheck
          shellcheck -S error scripts/ci/orgavela-cron-status-evaluate.sh
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          cat > "$fixture" <<'STATUS'
          ORGAVELA_AUDIT_TARGET=verified
          ORGAVELA_AUDIT_PLUGIN_VERSION=alpha2
          ORGAVELA_CRON_WP_AUTO=enabled
          ORGAVELA_CRON_WP_OPTION=valid
          ORGAVELA_AS_STORE=present
          ORGAVELA_AS_PENDING_OVERDUE_BUCKET=none
          ORGAVELA_AS_FAILED_LAST24H_BUCKET=none
          ORGAVELA_CRON_QUEUE_EVENT=scheduled-ahead
          ORGAVELA_CRON_DISPATCH_EXECUTED=no
          ORGAVELA_CRON_MIGRATION_EXECUTED=no
          STATUS
          bash scripts/ci/orgavela-cron-status-evaluate.sh "$fixture"
          for mutation in recent-failed old-pending queue-overdue wpcron-disabled wpcron-missing missing missing-target unexpected-execution duplicate; do
            case "$mutation" in
              recent-failed) sed -i 's/ORGAVELA_AS_FAILED_LAST24H_BUCKET=none/ORGAVELA_AS_FAILED_LAST24H_BUCKET=1-10/' "$fixture" ;;
              old-pending) sed -i 's/ORGAVELA_AS_PENDING_OVERDUE_BUCKET=none/ORGAVELA_AS_PENDING_OVERDUE_BUCKET=1-10/' "$fixture" ;;
              queue-overdue) sed -i 's/ORGAVELA_CRON_QUEUE_EVENT=scheduled-ahead/ORGAVELA_CRON_QUEUE_EVENT=overdue-over-15m/' "$fixture" ;;
              wpcron-disabled) sed -i 's/ORGAVELA_CRON_WP_AUTO=enabled/ORGAVELA_CRON_WP_AUTO=disabled/' "$fixture" ;;
              wpcron-missing) sed -i '/^ORGAVELA_CRON_WP_AUTO=/d' "$fixture" ;;
              missing) sed -i '/^ORGAVELA_AS_STORE=/d' "$fixture" ;;
              missing-target) sed -i 's/ORGAVELA_AUDIT_TARGET=verified/ORGAVELA_AUDIT_TARGET=unknown/' "$fixture" ;;
              unexpected-execution) sed -i 's/ORGAVELA_CRON_DISPATCH_EXECUTED=no/ORGAVELA_CRON_DISPATCH_EXECUTED=yes/' "$fixture" ;;
              duplicate) echo 'ORGAVELA_AUDIT_TARGET=verified' >> "$fixture" ;;
            esac
            if bash scripts/ci/orgavela-cron-status-evaluate.sh "$fixture" >/dev/null 2>&1; then
              echo "::error::O08 safety evaluator accepted forbidden fixture: $mutation"
              exit 1
            fi
            sed -i 's/ORGAVELA_AS_FAILED_LAST24H_BUCKET=1-10/ORGAVELA_AS_FAILED_LAST24H_BUCKET=none/' "$fixture"
            sed -i 's/ORGAVELA_AS_PENDING_OVERDUE_BUCKET=1-10/ORGAVELA_AS_PENDING_OVERDUE_BUCKET=none/' "$fixture"
            sed -i 's/ORGAVELA_CRON_QUEUE_EVENT=overdue-over-15m/ORGAVELA_CRON_QUEUE_EVENT=scheduled-ahead/' "$fixture"
            if [[ "$mutation" == 'wpcron-disabled' ]]; then sed -i 's/ORGAVELA_CRON_WP_AUTO=disabled/ORGAVELA_CRON_WP_AUTO=enabled/' "$fixture"; fi
            if [[ "$mutation" == 'wpcron-missing' ]]; then echo 'ORGAVELA_CRON_WP_AUTO=enabled' >> "$fixture"; fi
            # Restore fixture for next deliberately isolated negative condition.
            if [[ "$mutation" == 'missing' ]]; then echo 'ORGAVELA_AS_STORE=present' >> "$fixture"; fi
            if [[ "$mutation" == 'missing-target' ]]; then sed -i 's/ORGAVELA_AUDIT_TARGET=unknown/ORGAVELA_AUDIT_TARGET=verified/' "$fixture"; fi
            if [[ "$mutation" == 'unexpected-execution' ]]; then sed -i 's/ORGAVELA_CRON_DISPATCH_EXECUTED=yes/ORGAVELA_CRON_DISPATCH_EXECUTED=no/' "$fixture"; fi
            if [[ "$mutation" == 'duplicate' ]]; then sed -i '$d' "$fixture"; fi
          done
          bash scripts/ci/orgavela-cron-status-evaluate.sh "$fixture"
      - name: PHP diagnostic snippets parse cleanly (no execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          source = Path("scripts/ci/orgavela-readonly-audit.sh").read_text()
          parts = re.findall(r"php_code=\"\$\(cat <<'PHP'\n(.*?)\nPHP\n\)\"", source, flags=re.S)
          if len(parts) != 3:
              raise SystemExit(f"Expected 3 read-only PHP diagnostic fragments, got {len(parts)}")
          for index, fragment in enumerate(parts, 1):
              result = subprocess.run(["php", "-l"], input="<?php\n" + fragment, text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(f"PHP diagnostic fragment {index} failed syntax check")
          print("All three bounded WP-CLI diagnostics passed PHP syntax checks.")
          PY
  readonly-audit:
    if: github.repository == 'orgavela/Orgavela-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: orgavela-ionos
    env:
      IONOS_AUDIT_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_AUDIT_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
      IONOS_AUDIT_WP_ROOT: ${{ vars.IONOS_WP_ROOT || '/public' }}
      ORGAVELA_MONITOR_STRICT: ${{ (github.event_name == 'schedule' || inputs.strict_monitor == true) && '1' || '0' }}
    steps:
      - name: Checkout only trusted main workflow and read-only script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate checked-in SSH script syntax
        shell: bash
        run: bash -n scripts/ci/orgavela-readonly-audit.sh
      - name: Resolve explicit read-only audit request
        env:
          MANUAL_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            operation='cron'
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request='.github/audit-requests/orgavela-readonly.json'
            [[ -f "$request" ]] || exit 1
            operation="$(jq -er '.operation // empty' "$request")"
            target="$(jq -er '.target // empty' "$request")"
            [[ "$target" == 'orgavela.com' ]] || {
              echo "::error::Audit request target must be orgavela.com."; exit 1;
            }
          else
            operation="$MANUAL_OPERATION"
          fi
          [[ "$operation" == 'sftp' || "$operation" == 'probe' || "$operation" == 'schema' || "$operation" == 'backup-preflight' || "$operation" == 'cron' ]] || {
            echo "::error::Only sftp/probe/schema/backup-preflight/cron read-only operations are permitted."; exit 1;
          }
          printf 'AUDIT_OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
      - name: Install SSH transport (runner only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Run scoped read-only audit with secret-safe output
        shell: bash
        run: bash scripts/ci/orgavela-readonly-audit.sh "$AUDIT_OPERATION"
