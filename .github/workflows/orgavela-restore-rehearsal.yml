name: OrgaVela - synthetic isolated restore rehearsal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orgavela-restore-rehearsal.yml'
      - 'scripts/ci/orgavela-synthetic-restore.sh'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/orgavela-restore-rehearsal.yml'
      - 'scripts/ci/orgavela-synthetic-restore.sh'

permissions:
  contents: read

concurrency:
  group: orgavela-synthetic-restore-rehearsal
  cancel-in-progress: false

jobs:
  synthetic-restore:
    if: >-
      ${{
        github.repository == 'orgavela/Orgavela-Plugin' &&
        ((github.event_name == 'pull_request') ||
         (github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: synthetic-restore-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RESTORE_TEST_DATABASE_PASSWORD: synthetic-restore-ci-only
    steps:
      - name: Check out read-only committed fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check restore script syntax
        shell: bash
        run: bash -n scripts/ci/orgavela-synthetic-restore.sh
      - name: Prove repository and PR identity checks fail closed (no DB access)
        shell: bash
        run: |
          set -euo pipefail
          # Each command must exit 2 before attempting any DB operation.
          set +e
          GITHUB_REPOSITORY='foreign/not-orgavela' bash scripts/ci/orgavela-synthetic-restore.sh >/dev/null 2>&1
          wrong_repo=$?
          GITHUB_ACTIONS='false' bash scripts/ci/orgavela-synthetic-restore.sh >/dev/null 2>&1
          outside_ci=$?
          GITHUB_REF='refs/heads/untrusted' bash scripts/ci/orgavela-synthetic-restore.sh >/dev/null 2>&1
          bad_ref=$?
          set -e
          test "$wrong_repo" -eq 2
          test "$outside_ci" -eq 2
          test "$bad_ref" -eq 2
          echo 'Synthetic restore CI guardrails rejected invalid repository, runner, and ref.'
      - name: Install local client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client >/dev/null
      - name: Backup and restore only synthetic data in disposable service
        shell: bash
        run: bash scripts/ci/orgavela-synthetic-restore.sh
