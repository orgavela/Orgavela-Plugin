name: OrgaVela O03 retry missing read-only backup preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/o00-one-shot-evidence-audit-dispatch.yml
  pull_request:
    paths:
      - .github/workflows/o00-one-shot-evidence-audit-dispatch.yml

permissions:
  contents: read

jobs:
  static-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate fixed single read-only backup inventory operation
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rdate -e '
            c = YAML.safe_load(File.read(".github/workflows/o00-one-shot-evidence-audit-dispatch.yml"), permitted_classes: [Date, Time], aliases: true)
            abort "Workflow token overprivileged" unless c.fetch("permissions") == {"contents"=>"read"}
            job = c.fetch("jobs").fetch("dispatch-readonly-backup")
            guard = job.fetch("if")
            %w[push main orgavela/Orgavela-Plugin].each { |v| abort "Missing strict guard #{v}" unless guard.include?(v) }
            abort "Dispatcher must not use IONOS environment" if job.key?("environment")
            command = job.fetch("steps").last.fetch("run")
            abort "Wrong path" unless command.include?("orgavela-readonly-audit.yml/dispatches")
            abort "Wrong operation" unless command.include?("inputs[operation]=backup-preflight")
            abort "Cannot dispatch multiple jobs" if command.include?("for operation")
            abort "Must use normal GitHub dispatch" unless command.include?("gh api --method POST")
            puts "Only one fixed read-only O03 backup preflight may be dispatched."
          '

  dispatch-readonly-backup:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'orgavela/Orgavela-Plugin' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'ops(o03): retry one read-only backup preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scoped OrgaVela App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ORGAVELA_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORGAVELA_APP_PRIVATE_KEY }}
          owner: orgavela
          repositories: Orgavela-Plugin
          permission-actions: write
          permission-contents: read
      - name: Dispatch only normal read-only O03 backup preflight
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/orgavela/Orgavela-Plugin/actions/workflows/orgavela-readonly-audit.yml/dispatches" \
            -f ref=main -f "inputs[operation]=backup-preflight" >/dev/null
          echo "Requested precisely one read-only O03 backup metadata audit. No backup was created."
