name: Foundation and persistence
on:
  push:
  pull_request:
permissions:
  contents: read
# Keep one live run per branch/event; PR and push retain separate check suites.
# An older commit must never consume the matrix budget after being superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  COMPOSER_ROOT_VERSION: 0.1.0-alpha.2
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: node bin/schema-manifest.mjs --check
      - run: npm run build
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Reproducible release archive
        run: |
          php bin/package.php > /tmp/hash-one
          php bin/package.php > /tmp/hash-two
          diff /tmp/hash-one /tmp/hash-two
          unzip -l dist/uop-core.zip
          php tests/packaging.php
      - uses: actions/upload-artifact@v4
        with:
          name: uop-core
          path: dist/uop-core.zip
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: uop_disposable_test
          MYSQL_DATABASE: uop_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -puop_disposable_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip
          tools: composer:v2, wp-cli
          coverage: none
      - name: Ensure verified WP-CLI binary
        run: bash bin/ensure-wp-cli.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - name: Install disposable WordPress
        env:
          WP_VERSION: ${{ matrix.php == '8.3' && '6.9' || '7.1.1' }}
        run: |
          echo "WP_ROOT=/tmp/uop-wordpress" >> "$GITHUB_ENV"
          echo "UOP_TEST_ALLOW_DATABASE=1" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          echo "WP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          wp core download --version="$WP_VERSION" --path=/tmp/uop-wordpress
          wp config create --path=/tmp/uop-wordpress --dbname=uop_test --dbuser=root --dbpass=uop_disposable_test --dbhost=127.0.0.1 --dbcharset=utf8mb4 --dbprefix=uop_ci_
          wp config set WP_DEBUG true --raw --path=/tmp/uop-wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/uop-wordpress
          wp config set DISABLE_WP_CRON true --raw --path=/tmp/uop-wordpress
          wp core install --path=/tmp/uop-wordpress --url=http://127.0.0.1:8080 --title=UOP-Test --admin_user=uop_test_admin --admin_password="$password" --admin_email=uop@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/uop-wordpress/wp-content/plugins/uop-core
      - name: Fully completed PHPUnit integration suite (no hidden wp_die exits)
        run: |
          report="$RUNNER_TEMP/uop-integration-junit.xml"
          rm -f "$report"
          vendor/bin/phpunit -c phpunit.integration.xml --log-junit "$report"
          # WP core wp_die() could previously exit 0 before PHPUnit wrote its
          # final result. Verify a complete JUnit report and the full suite.
          UOP_JUNIT_REPORT="$report" php -r '
            $path = getenv("UOP_JUNIT_REPORT");
            if (!is_file($path) || filesize($path) < 100) {
              fwrite(STDERR, "Integration suite exited without complete JUnit output.\n");
              exit(1);
            }
            $xml = simplexml_load_file($path);
            if (!$xml || $xml->getName() !== "testsuites") {
              fwrite(STDERR, "Integration suite did not produce a valid report.\n");
              exit(1);
            }
            $tests = (int) $xml["tests"];
            $failures = (int) $xml["failures"];
            $errors = (int) $xml["errors"];
            // PHPUnit 11 commonly puts aggregate counts on its child suite.
            if (!$tests) {
              foreach ($xml->testsuite as $suite) {
                $tests += (int) $suite["tests"];
                $failures += (int) $suite["failures"];
                $errors += (int) $suite["errors"];
              }
            }
            if ($tests < 140 || $failures > 0 || $errors > 0) {
              fwrite(STDERR, "Integration suite incomplete or failing: {$tests} tests.\n");
              exit(1);
            }
            echo "Verified full integration suite: {$tests} tests.\n";
          '
      - name: M4 fifty-worker capacity concurrency regression
        if: ${{ matrix.php == '8.3' && matrix.db == 'mysql:8.0' || matrix.php == '8.5' && matrix.db == 'mariadb:10.11' }}
        timeout-minutes: 5
        run: php tests/Fixtures/m4-capacity-stress.php
      - name: WP CLI activation and deactivation
        run: |
          wp plugin activate uop-core --path="$WP_ROOT"
          wp plugin deactivate uop-core --path="$WP_ROOT"
      - name: P4 Guardian retention via Action Scheduler (disposable only)
        if: ${{ matrix.php == '8.3' && matrix.db == 'mariadb:10.11' }}
        timeout-minutes: 3
        run: |
          # Isolated fixture requires GITHUB_ACTIONS, WP_ROOT, DISABLE_WP_CRON,
          # a precise loopback URL and an explicit CI opt-in. No IONOS calls.
          wp plugin activate uop-core --path="$WP_ROOT"
          UOP_P4_SCHEDULER_PROBE=1 UOP_P4_PROBE_ACTION=seed wp eval-file tests/Fixtures/p4-guardian-scheduler-probe.php --path="$WP_ROOT"
          UOP_P4_SCHEDULER_PROBE=1 UOP_P4_PROBE_ACTION=dispatch wp eval-file tests/Fixtures/p4-guardian-scheduler-probe.php --path="$WP_ROOT"
          wp plugin deactivate uop-core --path="$WP_ROOT"
      - name: O04 isolated external WP-CLI cron trigger with hook/group isolation
        if: ${{ matrix.php == '8.3' && matrix.db == 'mariadb:10.11' }}
        timeout-minutes: 3
        run: |
          # Separate WP-CLI subprocess; WP-Cron is disabled, no browser or
          # WordPress HTTP worker can execute the seed's due actions.
          # Restrict work to our Guardian hook and UOP group: decoys prove
          # unrelated plugin work and other UOP hooks remain untouched.
          wp plugin activate uop-core --path="$WP_ROOT"
          # Action Scheduler's temporary HybridStore can reject --group
          # even for a group already written to its DBStore. In this
          # DISPOSABLE CI database only, complete the default migration and
          # demand the normal custom-table store before the scoped CLI run.
          store="$(wp eval 'echo get_class(\\ActionScheduler::store());' --path="$WP_ROOT")"
          if [ "$store" = "ActionScheduler_HybridStore" ]; then
            wp action-scheduler migrate --batch-size=100 --path="$WP_ROOT"
          fi
          store="$(wp eval 'echo get_class(\\ActionScheduler::store());' --path="$WP_ROOT")"
          if [ "$store" != "ActionScheduler_DBStore" ]; then
            echo "Action Scheduler group-scoped CLI needs a fully migrated DBStore; found: $store"
            exit 1
          fi
          UOP_O04_EXTERNAL_CI=1 UOP_O04_EXTERNAL_MODE=seed wp eval-file tests/Fixtures/o04-external-cli-cron-probe.php --path="$WP_ROOT"
          wp action-scheduler run --hooks=uop_guardian_quota_prune --group=uop --batch-size=1 --batches=1 --path="$WP_ROOT"
          UOP_O04_EXTERNAL_CI=1 UOP_O04_EXTERNAL_MODE=verify wp eval-file tests/Fixtures/o04-external-cli-cron-probe.php --path="$WP_ROOT"
          wp plugin deactivate uop-core --path="$WP_ROOT"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser activation smoke
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d max_execution_time=90 -d memory_limit=512M -S 127.0.0.1:8080 -t "$WP_ROOT" > /tmp/uop-server.log 2>&1 &
          server_pid=$!
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/wp-login.php; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "WordPress test server exited before becoming ready"
              cat /tmp/uop-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for WordPress test server readiness"
            cat /tmp/uop-server.log
            exit 1
          fi
          if ! npm run test:browser; then
            echo "::group::Disposable WordPress test server diagnostics"
            tail -n 160 /tmp/uop-server.log || true
            echo "::endgroup::"
            echo "::group::Disposable WordPress PHP diagnostics"
            if [ -f "$WP_ROOT/wp-content/debug.log" ]; then
              tail -n 80 "$WP_ROOT/wp-content/debug.log"
            fi
            echo "::endgroup::"
            exit 1
          fi
      - name: Repeat activation/deactivation browser regression on PHP 8.4 and MariaDB
        if: ${{ matrix.php == '8.4' && matrix.db == 'mariadb:10.11' }}
        timeout-minutes: 5
        run: |
          # Verify that a green result is repeatable rather than a one-off
          # rerun after the intermittent WordPress plugin-table timeout.
          if ! npx playwright test tests/Browser/activation.spec.js --repeat-each=3; then
            echo "::group::Disposable PHP web server diagnostics"
            tail -n 160 /tmp/uop-server.log || true
            echo "::endgroup::"
            echo "::group::WordPress PHP debug log"
            if [ -f "$WP_ROOT/wp-content/debug.log" ]; then
              tail -n 80 "$WP_ROOT/wp-content/debug.log"
            fi
            echo "::endgroup::"
            exit 1
          fi
      - name: Multisite persistence regression
        run: |
          wp core multisite-convert --path="$WP_ROOT" --title=UOP-Network
          wp eval-file "$GITHUB_WORKSPACE/tests/multisite.php" --path="$WP_ROOT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ strategy.job-index }}
          path: |
            test-results/
            /tmp/uop-server.log
            /tmp/uop-wordpress/wp-content/debug.log
  artifact-smoke:
    needs: quality
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: uop_disposable_test
          MYSQL_DATABASE: uop_artifact
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -puop_disposable_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uop-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          tools: wp-cli
          coverage: none
      - name: Ensure verified WP-CLI binary
        run: bash bin/ensure-wp-cli.sh
      - run: |
          wp core download --version=6.9 --path=/tmp/wordpress
          wp config create --path=/tmp/wordpress --dbname=uop_artifact --dbuser=root --dbpass=uop_disposable_test --dbhost=127.0.0.1 --dbcharset=utf8mb4
          wp core install --path=/tmp/wordpress --url=http://example.invalid --title=Artifact --admin_user=test_admin --admin_password="$(openssl rand -hex 20)" --admin_email=test@example.invalid --skip-email
          wp plugin install "$PWD/uop-core.zip" --activate --path=/tmp/wordpress
          wp plugin deactivate uop-core --path=/tmp/wordpress
