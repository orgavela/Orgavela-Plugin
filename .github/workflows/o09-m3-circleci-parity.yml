name: O09 M3 - CircleCI PHP-image diagnostic parity

on:
  push:
    branches:
      - integration/o09-m3-forms-events-20261105
    paths:
      - '.github/workflows/o09-m3-circleci-parity.yml'

permissions:
  contents: read

jobs:
  circleci-image-parity:
    if: github.repository == 'orgavela/Orgavela-Plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: cimg/php:8.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provider embedded PHP source syntax parity
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/ci/orgavela-readonly-audit.sh
          bash -n scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "orgavela/Orgavela-Plugin" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_DISPATCH_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          grep -Fq "ORGAVELA_CRON_MIGRATION_EXECUTED=no" scripts/ci/orgavela-readonly-audit.sh
          
          # Parse only; NEVER eval a diagnostic against WordPress or a host.
          awk '
            /^[[:space:]]*php_code="\$\(cat \074\074\047PHP\047$/ {
              count++;
              file = sprintf("/tmp/uop-readonly-%d.php", count);
              print "<?php" > file;
              inside = 1;
              next;
            }
            inside && /^PHP$/ {
              close(file);
              inside = 0;
              next;
            }
            inside { print >> file }
            END { if (count != 3 || inside) exit 1 }
          ' scripts/ci/orgavela-readonly-audit.sh
          for number in 1 2 3; do
            php -l "/tmp/uop-readonly-$number.php"
          done
          if grep -Eq '^[[:space:]]*(wp[[:space:]]+(cron[[:space:]]+event[[:space:]]+run|action-scheduler[[:space:]]+run)|crontab[[:space:]]+-)' scripts/ci/orgavela-readonly-audit.sh; then
            echo "Refusing any execution or mutation inside the read-only audit."
            exit 1
          fi
      - name: CircleCI image tooling and read-only operations safety syntax
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          bash -n scripts/ci/orgavela-readonly-audit.sh
          bash -n scripts/ci/orgavela-cron-status-evaluate.sh
          bash -n scripts/ci/orgavela-cron-evaluator-tests.sh
          bash scripts/ci/orgavela-cron-evaluator-tests.sh
      - name: Reproduce provider Composer validation and PHP checks
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer lint
          composer analyse
          composer test
